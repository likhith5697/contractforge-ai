services:
  banking-api:
    build:
      context: ./banking-api
      dockerfile: Dockerfile
    image: banking-api:local
    container_name: banking-api
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  contractforge-ai:
    build:
      context: ./contractforge-ai
      dockerfile: Dockerfile
    image: contractforge-ai:local
    container_name: contractforge-ai
    ports:
      - "8081:8081"
    env_file:
      # Optional: only needed for Phase 2/3 (OpenAI scenario generation). Copy
      # contractforge-ai/.env.example to contractforge-ai/.env and set your key there -
      # that file is git-ignored and never committed. Phase 1 works fine without it.
      - path: ./contractforge-ai/.env
        required: false
    environment:
      # Reach banking-api by its Compose service name on the shared network -
      # no host.docker.internal needed since both containers run together here.
      CONTRACTFORGE_OPENAPI_SOURCE_URL: http://banking-api:8080/v3/api-docs
      # POST /api/pipeline/run executes against a target it validates against this
      # allowlist. Inside this container "localhost:8080" would mean itself, not
      # banking-api - so the Compose service name must be explicitly allow-listed
      # for the pipeline endpoint to be usable at all when run this way.
      CONTRACTFORGE_EXECUTION_ALLOWED_BASE_URLS: http://banking-api:8080,http://localhost:8080,http://127.0.0.1:8080
    depends_on:
      banking-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
